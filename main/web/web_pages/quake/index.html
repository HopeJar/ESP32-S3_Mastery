<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ESP QuakeJS</title>
    <style>
      html,
      body,
      #viewport-frame {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #viewport-frame {
        position: fixed;
        inset: 0;
      }

      #viewport-frame:focus {
        outline: none;
      }

      .boot {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        max-width: calc(100vw - 24px);
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #f2f2f2;
        background: rgba(0, 0, 0, 0.72);
        font: 12px/1.4 Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div id="viewport-frame" tabindex="0"></div>
    <div id="boot-status" class="boot">Loading QuakeJS...</div>

    <script>
      function getQueryCommands() {
        var search = /([^&=]+)/g;
        var query = window.location.search.substring(1);
        var args = [];
        var match;

        while ((match = search.exec(query))) {
          var val = decodeURIComponent(match[1]).split(" ");
          val[0] = "+" + val[0];
          args.push.apply(args, val);
        }

        return args;
      }

      window.onload = function () {
        var status = document.getElementById("boot-status");

        function resizeViewport() {
          if (!window.ioq3 || !ioq3.canvas) return;
          if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement) return;
          ioq3.setCanvasSize(ioq3.viewport.offsetWidth, ioq3.viewport.offsetHeight);
        }

        if (!window.ioq3) {
          status.textContent = "QuakeJS engine did not load.";
          return;
        }

        ioq3.viewport = document.getElementById("viewport-frame");
        ioq3.elementPointerLock = true;
        window.addEventListener("resize", resizeViewport);

        var args = ["+set", "fs_cdn", window.location.host];
        args.push.apply(args, getQueryCommands());
        status.textContent = "Starting QuakeJS...";
        ioq3.callMain(args);
      };
    </script>
    <script src="/quake/ioquake3.js"></script>
  </body>
</html>
